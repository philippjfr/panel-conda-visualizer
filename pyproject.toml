[build-system]
requires = ["hatchling", "hatch-vcs", "panel>=1.8.0"]
build-backend = "hatchling.build"

[project]
name = "conda-visualizer"
dynamic = ["version"]
description = "Interactive dependency graphs for conda environments, lockfiles and DOT files"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
dependencies = [
  "networkx>=3",
  "panel>=1.8",
  "panel-material-ui>=0.10",
  "param>=2",
  "pydot>=3",
  "packaging",
  "pyyaml",
]

[project.optional-dependencies]
solve = ["py-rattler>=0.20"]

[project.scripts]
conda-visualizer = "conda_visualizer.cli:main"

[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "no-guess-dev" }

[tool.hatch.build.hooks.vcs]
version-file = "src/conda_visualizer/_version.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/conda_visualizer"]
artifacts = ["src/conda_visualizer/dist/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/conda_visualizer/dist/**"]


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.12"
networkx = ">=3"
panel = ">=1.8"
panel-material-ui = ">=0.10"
param = ">=2"
pydot = ">=3"
packaging = "*"
pyyaml = "*"
py-rattler = ">=0.20"

[tool.pixi.pypi-dependencies]
conda-visualizer = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-xdist = "*"
pytest-playwright = "*"
ruff = "*"

[tool.pixi.feature.test.tasks]
install-browser = "playwright install chromium"
test = "pytest tests -m 'not ui'"
test-ui = "pytest tests -m ui"
lint = "ruff check src tests && ruff format --check src tests"

[tool.pixi.feature.compile.dependencies]
nodejs = ">=18"
esbuild = "*"

[tool.pixi.feature.compile.tasks]
compile = { cmd = "panel compile conda_visualizer", env = { PYTHONPATH = "./src" } }

[tool.pixi.feature.build.dependencies]
python-build = "*"
twine = "*"
hatch-vcs = "*"

[tool.pixi.feature.build.tasks]
build-wheel = "python -m build ."
check-wheel = "twine check dist/*"
build-browser = "python scripts/build_browser.py"

[tool.pixi.tasks]
serve = "panel serve src/conda_visualizer/app.py --dev --show"

[tool.pixi.environments]
default = { features = ["test", "compile"], solve-group = "default" }
build = { features = ["build", "compile"], solve-group = "default" }

[tool.pytest.ini_options]
markers = ["ui: Playwright browser tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:pydot.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
